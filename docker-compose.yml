services:
  # ---------------------------------------------------------------------------
  # Frontend — Next.js production build
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: frontend_service
      dockerfile: Dockerfile
      args:
        # Build-time only (see Dockerfile) — the browser's direct WS to LLM_service's
        # realtime voice endpoint (MVP; no Java WS proxy yet).
        NEXT_PUBLIC_LLM_SERVICE_WS_URL: ${NEXT_PUBLIC_LLM_SERVICE_WS_URL}
    ports:
      - "3000:3000"
    environment:
      # Legacy single-purpose generator endpoint (POST /generate-text), still direct.
      - TEXT_AGENT_URL=http://llm:8080
      # Java backend — signup/login AND the whole workflow surface (/tasks, /video-jobs,
      # /intake/classify). The frontend no longer holds an LLM_SERVICE_URL for those: identity
      # is only VERIFIABLE in Java (it owns the JWT signing key), so routing round it would mean
      # `business_id` — which picks the brand profile a run reads and writes — is whatever the
      # caller typed. Do not re-add a direct route without moving that check with it.
      - BACKEND_URL=http://backend:8081
    depends_on:
      - llm
      - backend

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot Java service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: tsldemo
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LLM_SERVICE_BASE_URL=http://llm:8080
      # Database: whatever application.properties / the environment already says — i.e. the same
      # cluster this backend has always used. It is deliberately NOT redirected here.
      #
      # An earlier version of this file defaulted it to the local `database` service, meaning to be
      # safe. It was the opposite: the LLM service's own DATABASE_URL still pointed at the shared
      # cluster, so half the world was fresh and half was production. A fresh backend database
      # restarts its business-id sequence at 1, and those ids then collided with the real plans and
      # brand profiles the LLM service still held for businesses 1 and 2 — a test account
      # inherited a stranger's campaigns, and the real accounts could no longer log in.
      #
      # The rule this encodes: the backend's database and the LLM service's store are ONE world.
      # Move them together or not at all. `docker-compose.mock.yml` moves both.
      #
      # Nothing is listed here on purpose — an empty `SPRING_DATASOURCE_URL=` would not mean
      # "unset", it would override application.properties with an empty string and fail startup.
      # To point a deployed stack elsewhere, set the three SPRING_DATASOURCE_* vars in your `.env`.
      # Signs the JWTs whose subject decides which brand a run reads and writes — see
      # BriefIdentity / TaskAccess. The dev default keeps `docker compose up` working out of the
      # box; set a real secret anywhere the stack is reachable by anyone else.
      # Default MATCHES application.properties on purpose. Introducing a different one here would
      # silently invalidate every token already issued — every logged-in browser gets bounced with
      # no explanation, because the signature no longer verifies. Override it in `.env` for any
      # deployment; changing it is a deliberate act of logging everyone out.
      - JWT_SECRET=${JWT_SECRET:-starlight-default-secret-change-in-production}
      # Supabase credentials — override here or in a .env file if needed.
      # Defaults are already baked into application.properties.
      # LinkedIn/Meta OAuth — must match the redirect URI registered on the respective Developer
      # app, and where to send the browser back to after the OAuth round-trip.
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-http://localhost:8081/linkedin/callback}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-http://localhost:8081/meta/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      - llm

  # ---------------------------------------------------------------------------
  # LLM Service — Python FastAPI (MAF virtual-newsroom workflow)
  # Requires AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY for production.
  # Runs in mock mode by default (USE_MOCK=true) so it starts without creds.
  # ---------------------------------------------------------------------------
  llm:
    build:
      context: .
      dockerfile: LLM_service/Dockerfile
    # ⚠️ SECURITY: this service has NO authentication of its own. It trusts `business_id` /
    # `user_id` in the request body, and those select which brand's voice profile a run reads and
    # writes — so anything that can reach this port can read and poison any tenant's data. It is
    # safe only because the backend in front of it derives those from a verified token.
    #
    # Publishing 8080 to the host therefore keeps that hole open, and it is published here for
    # exactly ONE reason: the browser opens a DIRECT WebSocket to /intake/{sid}/voice for realtime
    # speech (frontend_service/app/chat/useRealtimeVoice.ts — there is no WS proxy in Java yet).
    # Closing this properly means building that proxy and then deleting this `ports:` block; the
    # HTTP surface already needs no host access, since every caller reaches it over the compose
    # network as http://llm:8080.
    #
    # Until then, at minimum do not expose 8080 beyond the host in any deployed environment
    # (bind it to the loopback, or drop it at the security group / firewall).
    ports:
      - "8080:8080"
    environment:
      # Set to true for local development without Azure credentials.
      - USE_MOCK=false

      # Video renderer
      - VIDEO_RENDER_BACKEND=${VIDEO_RENDER_BACKEND:-local}

      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT}
      - USE_MOCK_VOICEOVER=${USE_MOCK_VOICEOVER}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      - VOICEOVER_DEFAULT_VOICE=${VOICEOVER_DEFAULT_VOICE}
      - USE_MOCK_MUSIC_GENERATION=${USE_MOCK_MUSIC_GENERATION}
      # Web search (Bing grounding via Azure AI Foundry agents). FOUNDRY_PROJECT_ENDPOINT
      # must be set here too — get_web_search() raises without it once USE_MOCK_WEB_SEARCH
      # is false, since it's the endpoint the WEB_SEARCH_AGENT_* names below resolve against.
      - FOUNDRY_PROJECT_ENDPOINT=${FOUNDRY_PROJECT_ENDPOINT}
      - USE_MOCK_WEB_SEARCH=false
      - WEB_SEARCH_AGENT_NAME=${WEB_SEARCH_AGENT_NAME}
      - WEB_SEARCH_AGENT_VERSION=${WEB_SEARCH_AGENT_VERSION}
      - REVIEW_SEARCH_AGENT_NAME=${REVIEW_SEARCH_AGENT_NAME}
      - REVIEW_SEARCH_AGENT_VERSION=${REVIEW_SEARCH_AGENT_VERSION}

      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}

      - USE_MOCK_IMAGE_SEARCH=false
      - USE_MOCK_BACKGROUND_REMOVAL=false

      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - REMOVEBG_API_KEY=${REMOVEBG_API_KEY}

      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - GEOAPIFY_MAP_STYLE=${GEOAPIFY_MAP_STYLE}

      - USE_MOCK_MUSIC_GENERATION=true
      - USE_MOCK_SAFETY=false

      # Voice
      - USE_MOCK_VOICE=${USE_MOCK_VOICE}
      - AZURE_VOICELIVE_ENDPOINT=${AZURE_VOICELIVE_ENDPOINT}
      - AZURE_VOICELIVE_MODEL=${AZURE_VOICELIVE_MODEL}
      - AZURE_VOICELIVE_API_VERSION=${AZURE_VOICELIVE_API_VERSION}
      - AZURE_VOICELIVE_API_KEY=${AZURE_VOICELIVE_API_KEY}
      - AZURE_VOICELIVE_VOICE=${AZURE_VOICELIVE_VOICE}

      # Store
      - USE_MOCK_STORE=false

      # Roundtable
      - ROUNDTABLE_ENABLED=${ROUNDTABLE_ENABLED}
      - ROUNDTABLE_MAX_ROUNDS=${ROUNDTABLE_MAX_ROUNDS}
      - ROUNDTABLE_PERSONA_MAX_TOKENS=${ROUNDTABLE_PERSONA_MAX_TOKENS}
      - ROUNDTABLE_PERSONA_REASONING_EFFORT=${ROUNDTABLE_PERSONA_REASONING_EFFORT}
      - ROUNDTABLE_PERSONA_VERBOSITY=${ROUNDTABLE_PERSONA_VERBOSITY}
      - ROUNDTABLE_MANAGER_MODEL=${ROUNDTABLE_MANAGER_MODEL}
      - ROUNDTABLE_PERSONA_MODEL=${ROUNDTABLE_PERSONA_MODEL}
      - ROUNDTABLE_CONTROL_TIMEOUT=${ROUNDTABLE_CONTROL_TIMEOUT}
      - AZURE_PERSONA_ENDPOINT=${AZURE_PERSONA_ENDPOINT}
      - AZURE_PERSONA_API_KEY=${AZURE_PERSONA_API_KEY}
      - TREND_SCOUT_ENABLED=${TREND_SCOUT_ENABLED}

      # Code generation
      - CODEGEN_MAX_TOTAL_ATTEMPTS=${CODEGEN_MAX_TOTAL_ATTEMPTS}
      - CODEGEN_MAX_TOTAL_SECONDS=${CODEGEN_MAX_TOTAL_SECONDS}
      - CODEGEN_MODEL=${CODEGEN_MODEL}
      - CODEGEN_REASONING_EFFORT=${CODEGEN_REASONING_EFFORT}
      - CODEGEN_MAX_TOKENS=${CODEGEN_MAX_TOKENS}
      - CODEGEN_PLAN_MAX_TOKENS=${CODEGEN_PLAN_MAX_TOKENS}
      - CODEGEN_PLAN_REASONING_EFFORT=${CODEGEN_PLAN_REASONING_EFFORT}
      - CODEGEN_MAX_RETRIES=${CODEGEN_MAX_RETRIES}
      - CODEGEN_REVIEW_MAX_TOKENS=${CODEGEN_REVIEW_MAX_TOKENS}
      - CODEGEN_CONVERT_MAX_TOKENS=${CODEGEN_CONVERT_MAX_TOKENS}
      - CODEGEN_CONVERT_REASONING_EFFORT=${CODEGEN_CONVERT_REASONING_EFFORT}

      # Voiceover (Azure Speech TTS) — off by default (mock), opt-in per render via
      # POST /tasks/{id}/render-video's narration_text field either way.
      - ROUNDTABLE_TTS_KEY=${ROUNDTABLE_TTS_KEY}
      - ROUNDTABLE_TTS_REGION=${ROUNDTABLE_TTS_REGION}
      # Cloud (Remotion Lambda) video rendering — off by default (VIDEO_RENDER_BACKEND
      # defaults to "local", the subprocess path this image is already built for).
      # Uncomment once a function + stable site are deployed (see .env.example).
      # - AWS_REGION=${AWS_REGION}
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - REMOTION_LAMBDA_FUNCTION_NAME=${REMOTION_LAMBDA_FUNCTION_NAME}
      # - REMOTION_LAMBDA_SERVE_URL=${REMOTION_LAMBDA_SERVE_URL}

      # Higgsfield
      - USE_MOCK_VIDEO_GENERATION=false
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY}
      - HIGGSFIELD_API_SECRET=${HIGGSFIELD_API_SECRET}
      - HIGGSFIELD_IMAGE_MODEL=${HIGGSFIELD_IMAGE_MODEL}
      - HIGGSFIELD_TEXT_MODEL=${HIGGSFIELD_TEXT_MODEL}
      - HIGGSFIELD_MAX_DURATION_S=15
