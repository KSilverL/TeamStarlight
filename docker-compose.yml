services:

  # ---------------------------------------------------------------------------
  # Frontend — Next.js production build
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: frontend_service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # # Demo agent (brand card)
      # - BRAND_AGENT_URL=http://brand-agent:8000
      # Main LLM service (text generation + MAF workflow /tasks + video render jobs)
      - TEXT_AGENT_URL=http://llm:8080
      - LLM_SERVICE_URL=http://llm:8080
      # Java backend (signup / login)
      - BACKEND_URL=http://backend:8081
    depends_on:
      # - brand-agent
      - llm
      - backend

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot Java service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: tsldemo
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LLM_SERVICE_BASE_URL=http://llm:8080
      # Supabase credentials — override here or in a .env file if needed.
      # Defaults are already baked into application.properties.
    depends_on:
      - llm

  # ---------------------------------------------------------------------------
  # LLM Service — Python FastAPI (MAF virtual-newsroom workflow)
  # Requires AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY for production.
  # Runs in mock mode by default (USE_MOCK=true) so it starts without creds.
  # ---------------------------------------------------------------------------
  llm:
    build:
      # Context is the repo root, not LLM_service/ — the image also bundles the
      # sibling video_renderer/ Node project (local Remotion CLI render subprocess).
      context: .
      dockerfile: LLM_service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - USE_MOCK=false
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT}
      - DATABASE_URL=${DATABASE_URL}
      - USE_MOCK_IMAGE_SEARCH=false
      - USE_MOCK_BACKGROUND_REMOVAL=false
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - REMOVEBG_API_KEY=${REMOVEBG_API_KEY}
      - USE_MOCK_MUSIC_GENERATION=true
      - USE_MOCK_SAFETY=true
      # - SOUNDRAW_API_KEY=${SOUNDRAW_API_KEY}
      # Voiceover (Azure Speech TTS) — off by default (mock), opt-in per render via
      # POST /tasks/{id}/render-video's narration_text field either way.
      - USE_MOCK_VOICEOVER=true
      # - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      # - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      # Cloud (Remotion Lambda) video rendering — off by default (VIDEO_RENDER_BACKEND
      # defaults to "local", the subprocess path this image is already built for).
      # Uncomment once a function + stable site are deployed (see .env.example).
      # - VIDEO_RENDER_BACKEND=lambda
      # - AWS_REGION=${AWS_REGION}
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - REMOTION_LAMBDA_FUNCTION_NAME=${REMOTION_LAMBDA_FUNCTION_NAME}
      # - REMOTION_LAMBDA_SERVE_URL=${REMOTION_LAMBDA_SERVE_URL}

  # ---------------------------------------------------------------------------
  # Brand Agent — FastAPI LLM service (demo, isolated from LLM_service core)
  # Requires ANTHROPIC_API_KEY to be set in the environment or a .env file.
  # ---------------------------------------------------------------------------
  # brand-agent:
  #   build:
  #     context: LLM_service/demos/brand_agent
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}