[pytest]
# Canonical runner: from the repo root. pythonpath=. puts the root on sys.path so
# the `LLM_service` package (relative imports) resolves; testpaths points at the suite;
# asyncio_mode=auto lets the async tests run without per-test markers.
pythonpath = .
testpaths = LLM_service/tests
asyncio_mode = auto

# Coverage is ON by default (pytest-cov) — every run reports which LLM_service lines the
# suite actually exercised. What/how is configured in pyproject.toml ([tool.coverage.*]).
#   pytest                      → suite + a term-missing coverage summary
#   pytest --cov-report=html    → adds htmlcov/index.html (browsable, line-by-line)
#   pytest --no-cov             → skip coverage (fastest single-test iteration)
addopts = --cov --cov-report=term-missing:skip-covered

# Hand-written system-invariant tests live in LLM_service/tests/audit/ and carry this
# marker, so they can be run alone or excluded without touching the rest of the suite:
#   pytest                  → everything (main suite + audit)
#   pytest -m audit         → only the audit invariants
#   pytest -m "not audit"   → only the original suite
markers =
    audit: hand-written system-invariant tests (crash windows, safety gate, moderator robustness)
