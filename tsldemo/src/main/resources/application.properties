spring.application.name=tsldemo

# Datasource. The host/user are not secrets and keep working defaults; the password has no
# default on purpose, so it can only come from the environment.
# If POSTGRES_PASSWORD is unset, startup fails at the first connection with
# 'FATAL: password authentication failed for user "citus"' — not a placeholder error, since
# Spring binds the datasource password without insisting the placeholder resolve first.
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://c-starlight.x2pbktk6pzh5or.postgres.cosmos.azure.com:5432/starlight?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${POSTGRES_USER:citus}
spring.datasource.password=${POSTGRES_PASSWORD}

hibernate.hbm2ddl.auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=8081

# Raise the multipart limits above Spring's 1MB default. /linkedin/post-image and /meta/post
# both take the raw file from the browser, and the latter accepts video as well as images —
# hence the headroom. Spring's file-size-threshold defaults to 0, so these spool to disk rather
# than into the heap. Keep this as the ONLY multipart block: these keys were previously declared
# twice with different values, and the last declaration silently won.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:500MB}

# LLM service base URL — overridden by LLM_SERVICE_BASE_URL env var in Docker.
llm.service.base-url=${LLM_SERVICE_BASE_URL:http://localhost:8080}

# JWT signing secret — override via JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:starlight-default-secret-change-in-production}

# LinkedIn OAuth — the redirect URI must exactly match the one registered on the LinkedIn
# Developer app. Override via LINKEDIN_REDIRECT_URI once this backend is reachable at a
# non-localhost address (Docker/staging/prod).
linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8081/linkedin/callback}

# Where to send the browser after the LinkedIn OAuth round-trip (LinkedIn redirects here
# directly, bypassing the frontend's own routes) — override via FRONTEND_BASE_URL.
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Azure Blob Storage — staging area for Instagram publishing. Graph will not accept raw video
# bytes for a Reel; it fetches the file from a public URL itself, so the rendered MP4 is uploaded
# here and handed to Graph as a short-lived SAS URL (see VideoStorageService).
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:instagramcontent}