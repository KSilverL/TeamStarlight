spring.application.name=tsldemo

# Database credentials come from the environment — deliberately no defaults, so a stack
# started without them fails at boot with "Could not resolve placeholder 'DB_URL'" rather
# than silently falling back to someone else's cluster.
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

hibernate.hbm2ddl.auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Keep the default at 8081 — docker-compose.yml maps 8081:8081 and the frontend reaches this
# service at http://backend:8081, so overriding PORT alone would break both.
server.port=${PORT:8081}

# Raise the multipart limits above Spring's 1MB default so real images can be posted to
# LinkedIn via /linkedin/post-image. (Videos are not multipart — they're pulled by job id.)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# LLM service base URL — overridden by LLM_SERVICE_BASE_URL env var in Docker.
llm.service.base-url=${LLM_SERVICE_BASE_URL:http://localhost:8080}

# JWT signing secret — override via JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:starlight-default-secret-change-in-production}

# LinkedIn OAuth — the redirect URI must exactly match the one registered on the LinkedIn
# Developer app. Override via LINKEDIN_REDIRECT_URI once this backend is reachable at a
# non-localhost address (Docker/staging/prod).
linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8081/linkedin/callback}

# Where to send the browser after the LinkedIn OAuth round-trip (LinkedIn redirects here
# directly, bypassing the frontend's own routes) — override via FRONTEND_BASE_URL.
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# The zone a scheduled post's wall-clock time means when the caller doesn't send an offset.
# Never ZoneId.systemDefault(): that is UTC inside the container, so a 10:00 post went out at
# 11:00 Irish summer time. PlanScheduler's daily cron already runs in this zone.
app.timezone=${APP_TIMEZONE:Europe/Dublin}

# How often to look for posts that have come due, and how long after startup to start looking.
app.scheduling.sweep-interval-ms=${SCHEDULING_SWEEP_INTERVAL_MS:60000}
app.scheduling.sweep-initial-delay-ms=${SCHEDULING_SWEEP_INITIAL_DELAY_MS:20000}

# How late a post can be before publishing it does more harm than skipping it. A post whose
# time passed while this service was down is marked failed (and the user emailed) rather than
# published hours out of context.
app.scheduling.missed-cutoff-minutes=${SCHEDULING_MISSED_CUTOFF_MINUTES:360}

# Gap between starting one slot's draft and the next when a confirmed campaign is drafted.
# The LLM service returns as soon as a run starts, so without this a fifteen-slot campaign
# would fire fifteen concurrent workflow runs at once and invite rate limiting.
app.plans.draft-stagger-ms=${PLANS_DRAFT_STAGGER_MS:5000}

# When the backstop job looks for plan slots still unwritten as their date approaches. The
# whole campaign is normally drafted at confirm time, so this usually finds nothing.
app.plans.generation-cron=${PLANS_GENERATION_CRON:0 0 18 * * *}

# How many days ahead of a slot to draft its content. Must be >= 1: drafting on the slot's own
# day means the morning windows have already passed and there is no time for human review, so
# the post can never actually be scheduled. Raising it buys more review slack but drafts
# against an older trends snapshot.
app.plans.generation-lead-days=${PLANS_GENERATION_LEAD_DAYS:1}

# How often to look for approved plan copy that hasn't reached the calendar. Minutes rather
# than hours because the LLM service holds task outputs in memory — approved copy is only
# recoverable until that process restarts, so a slow sweep is one that finds it already gone.
app.plans.handoff-sweep-interval-ms=${PLANS_HANDOFF_SWEEP_INTERVAL_MS:120000}
app.plans.handoff-sweep-initial-delay-ms=${PLANS_HANDOFF_SWEEP_INITIAL_DELAY_MS:30000}

# Mail. Host/port have defaults because they are not secrets; the credentials default to blank
# so the stack still starts without them — JavaMailSender is only built when a mail is sent, so
# the failure surfaces at send time (missed-post notifications) instead of at boot.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Instagram + the blob container its video posts are staged in. Blank defaults: VideoStorageService
# builds its client per upload, so an unset connection string costs nothing until someone posts.
instagram.account.id=${INSTAGRAM_ACCOUNT_ID:}
instagram.account.token=${INSTAGRAM_ACCOUNT_TOKEN:}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:instagramcontent}
# File Size Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB